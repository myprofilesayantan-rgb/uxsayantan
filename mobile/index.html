<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sayantan Ghosh | Mobile Conversational AI UX Portfolio</title>
  
  <!-- Primary SEO & Social Metadata -->
  <meta name="description" content="Interactive Voice-over AI Resume & Portfolio of Sayantan Ghosh, Senior UX & Product Designer." />
  <meta name="theme-color" content="#151512" />

  <!-- Google Fonts: Inter & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />

  <!-- Core Tokens & AI Assistant Styles -->
  <link rel="stylesheet" href="../tokens.css?v=1.1" />
  <link rel="stylesheet" href="../components/ai-assistant/ai-assistant.css?v=1.1" />

  <style>
    /* Mobile-First Page Overrides */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #151512;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .desktop-switch-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: #94a3b8;
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.2s ease;
    }

    .desktop-switch-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- 🤖 AI Conversational Assistant Container -->
  <div id="ai-assistant-container" class="ai-assistant-container state-intro">
    
    <!-- 1. Header -->
    <header class="ai-mobile-header">
      <div class="ai-mobile-title">
        <h1 class="ai-mobile-logo">AI UX | SAYANTAN GHOSH</h1>
        <span class="ai-mobile-sub">Interactive Voice Portfolio</span>
      </div>
      <a href="../index.html?desktop=true" class="desktop-switch-btn" title="View Desktop Version">
        💻 Desktop Site
      </a>
    </header>

    <!-- 2. Main Content Viewport -->
    <main class="ai-content-viewport">
      
      <!-- Panel 1: Intro -->
      <div id="ai-screen-intro" class="ai-screen-panel ai-screen-intro active">
        <div class="ai-intro-avatar-box">
          <img src="../images/sayantan_pic.png" alt="Sayantan Ghosh" class="ai-intro-avatar" />
        </div>
        <p class="ai-intro-quote">"Hi! I'm San—Sayantan's AI voice assistant. Tap the glowing orb below to start our conversation!"</p>
      </div>

      <!-- Panel 2: Welcome & QA Capsule Stack -->
      <div id="ai-screen-welcome" class="ai-screen-panel ai-screen-welcome">
        <h2 class="ai-welcome-hi">Hi.</h2>
        <p class="ai-welcome-text">Tap any capsule pill below to hear Sayantan's experience & design philosophy:</p>
        
        <div class="ai-qa-stack">
          <div class="ai-qa-row">
            <button class="ai-capsule-chip" data-topic="Professional">💼 Professional Experience</button>
            <button class="ai-capsule-chip" data-topic="Educational">🎓 Education & Academy</button>
          </div>
          <div class="ai-qa-row">
            <button class="ai-capsule-chip" data-topic="Personal">💡 About Sayantan</button>
            <button class="ai-capsule-chip" data-topic="Skill">🛠️ Core Skills & Tools</button>
          </div>
          <div class="ai-qa-row">
            <button class="ai-capsule-chip" data-topic="Thinking">🧠 UX Thinking Process</button>
            <button class="ai-capsule-chip" data-topic="Projects">🚀 Featured Case Study</button>
          </div>
          <div class="ai-qa-row">
            <button class="ai-capsule-chip" data-topic="Communication">📞 Get In Touch</button>
          </div>
        </div>
      </div>

      <!-- Panel 3: Answer View -->
      <div id="ai-screen-answer" class="ai-screen-panel ai-screen-answer">
        <div class="ai-answer-card">
          <span id="ai-answer-title" class="ai-answer-title"></span>
          <div id="ai-answer-content" class="ai-answer-content"></div>
        </div>
      </div>

    </main>

    <!-- 3. Bottom Siri/Gemini Controls & Breathing Orb -->
    <footer class="ai-bottom-controls">
      <div id="ai-siri-orb" class="ai-siri-orb" role="button" aria-label="Toggle Voice AI Assistant">
        <svg class="ai-mic-icon" viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <div class="ai-stop-square"></div>
      </div>
      <span id="ai-orb-caption" class="ai-orb-caption">Press orb to start voice conversation</span>
      
      <button id="ai-back-pill" class="ai-back-pill" aria-label="Back to topic menu">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </footer>

  </div>

  <!-- AI Assistant Logic -->
  <script src="../components/ai-assistant/ai-assistant.js?v=1.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.PortfolioAiAssistant) {
        PortfolioAiAssistant.init(document.getElementById('ai-assistant-container'));
      }
    });
  </script>
</body>
</html>
